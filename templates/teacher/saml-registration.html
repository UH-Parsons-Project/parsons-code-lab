<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Complete HY registration | Parsons Code Lab</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/base/main.css">
</head>
<body>
    <main class="container mt-5" style="max-width: 560px;">
        <h1>Complete teacher registration</h1>
        <p>Enter the registration token provided by the administrator to create your teacher account.</p>
        {% if registration_error %}
        <div class="alert alert-danger">The registration token is missing, invalid, or expired.</div>
        {% endif %}
        <form method="post" action="/auth/saml/login">
            <div class="form-group">
                <label for="registration_token">Registration token</label>
                <input type="password" class="form-control" id="registration_token" name="registration_token" required>
            </div>
            <button type="submit" class="btn btn-primary">Create account</button>
        </form>
    </main>
</body>
</html>
