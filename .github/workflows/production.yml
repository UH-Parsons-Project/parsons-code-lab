name: Deploy to production

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v

  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Playwright cache scope
        run: echo "PLAYWRIGHT_CACHE_SCOPE=production-playwright-shard-${{ matrix.shard }}" >> "$GITHUB_ENV"
      
      - name: Create .env file with secrets
        run: echo "TEACHER_REGISTRATION_TOKEN=${{ secrets.TEACHER_REGISTRATION_TOKEN }}" > .env
      
      - name: Clean up Docker resources
        run: docker compose down -v
        continue-on-error: true
      
      - name: Start web stack for Playwright shard (retry on transient pull/build failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Starting Playwright stack (attempt ${attempt}/3)"
            if docker compose --profile test up --build -d db web-test; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Compose startup failed, retrying in 20s..."
              docker compose down -v --remove-orphans || true
              sleep 20
            fi
          done

          echo "Compose startup failed after 3 attempts"
          exit 1

      - name: Run Playwright shard
        run: docker compose --profile test run --rm test npx playwright test --shard=${{ matrix.shard }}/4

      - name: Tear down Docker resources
        if: always()
        run: docker compose down -v --remove-orphans
      
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, playwright-tests]

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Login to Quay # Try to login with the token an username in github actions secretss || using --password-stdin so that the password is not reaveled in the console
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | docker login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Build docker image # Build and name the image for production
      - name: Push to Quay # Push the docker built image to quay
          uses: docker/build-push-action@v6
          with:
           context: .
           file: Dockerfile.prod
           push: true
           tags: quay.io/tike/ohtu-faded-parsons:production
           cache-from: type=gha,scope=production
           cache-to: type=gha,mode=max,scope=production
