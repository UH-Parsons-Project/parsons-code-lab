# Local development configuration for Faded Parsons Problems
# Usage: docker compose --profile web up --build
# Tests: docker compose --profile test up --build --abort-on-container-exit
# Note: Database is non-persistent - data is cleared when containers are stopped

services:
  # PostgreSQL database - local development only, production uses external database
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres  # Change in production!
      POSTGRES_DB: faded_parsons
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["web"]

  # Main web application
  web:
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/faded_parsons
      AUTO_INIT_DB: "true"
      # Allow manual DB reset and seeding via /api/reset-db and /api/seed-db endpoints
      DEVELOPMENT_MODE: "true"
      TEST_MODE: "true"
      SECRET_KEY: "${SECRET_KEY:-test-secret-key-for-local-dev-only}"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["web"]

  # Isolated PostgreSQL instance used exclusively by the test profile
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faded_parsons_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network
    profiles: ["test"]

  # Web app instance for running tests against
  web-test:
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app/backend
      - ./css:/app/css
      - ./js:/app/js
      - ./js-parsons:/app/js-parsons
      - ./templates:/app/templates
      - ./tests:/app/tests
      - ./utils:/app/utils
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-test:5432/faded_parsons_test
      AUTO_INIT_DB: "true"
      TEST_MODE: "true"
      SECRET_KEY: "test-secret-key-for-tests-only"
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - test-network
    profiles: ["test"]  # Only starts with: docker compose --profile test

  # Unit test runner
  unittest:
    profiles: ["unittest"]
    build:
      context: .
      dockerfile: Dockerfile.unittest
    env_file:
      - .env
    volumes:
      - ./tests:/usr/src/app/tests
      - ./backend:/usr/src/app/backend
      - ./utils:/usr/src/app/utils
      - ./templates:/usr/src/app/templates
      - ./htmlcov:/usr/src/app/htmlcov

  # Playwright test runner
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      - web-test
    env_file:
      - .env
    environment:
      BASE_URL: http://web-test:8000
    networks:
      - test-network
    volumes:
      - ./tests:/usr/src/app/tests
      - ./playwright.config.js:/usr/src/app/playwright.config.js

networks:
  test-network:
    driver: bridge
