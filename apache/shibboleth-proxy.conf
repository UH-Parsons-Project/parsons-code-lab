<VirtualHost *:8080>
    ServerName faded-parsons-staging-timed-parsons.apps.ocp-test-0.k8s.it.helsinki.fi

    ProxyRequests Off
    ProxyPreserveHost On
    SetEnv HTTPS on
    SetEnv SERVER_PORT 443

    # Shibboleth owns its handler URLs; do not proxy them to Uvicorn.
    ProxyPass /Shibboleth.sso !
    <Location /Shibboleth.sso>
        SetHandler shib
    </Location>

    # The login entry point starts a Shibboleth session when needed.
    <Location /auth/saml/login>
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        Require valid-user
        SSLOptions +StdEnvVars
    </Location>

    # API authentication remains the application's responsibility.
    <Location /api>
        ShibRequestSetting requireSession 0
        Require all granted
    </Location>

    # Never trust identity headers supplied by the client.
    RequestHeader unset Shib-Session-ID
    RequestHeader unset REMOTE_USER
    RequestHeader unset eppn
    RequestHeader unset mail
    RequestHeader unset uid

    # Forward only values produced by the authenticated Shibboleth session.
    RequestHeader set Shib-Session-ID "%{Shib-Session-ID}e" env=Shib-Session-ID
    RequestHeader set REMOTE_USER "%{REMOTE_USER}e" env=REMOTE_USER
    RequestHeader set eppn "%{eppn}e" env=eppn
    RequestHeader set mail "%{mail}e" env=mail
    RequestHeader set uid "%{uid}e" env=uid

    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
