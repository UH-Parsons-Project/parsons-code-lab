apiVersion: apps/v1
kind: Deployment
metadata:
  name: faded-parsons-staging
  namespace: timed-parsons
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"ohtu-faded-parsons:staging","namespace":"timed-parsons"},"fieldPath":"spec.template.spec.containers[?(@.name==\"faded-parsons-staging\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faded-parsons-staging
  template:
    metadata:
      labels:
        app: faded-parsons-staging
    spec:
      containers:
        - name: faded-parsons-staging
          image: quay.io/tike/ohtu-faded-parsons:staging
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL
            - name: AUTO_INIT_DB
              value: "false"
            - name: TEACHER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: teachertoken
                  key: TEACHER_REGISTRATION_TOKEN
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SECRET_KEY
            - name: ALLOWED_ORIGINS
              value: "https://faded-parsons-staging-timed-parsons.apps.ocp-test-0.k8s.it.helsinki.fi"
            - name: COOKIE_SECURE
              value: "true"
          envFrom:
            - secretRef:
                name: saml-config-staging
                optional: true
          volumeMounts:
            - name: saml-certificates
              mountPath: /etc/saml
              readOnly: true
            - name: saml-idp-certificate
              mountPath: /etc/saml/idp
              readOnly: true
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /
              port: 8000

          livenessProbe:
            httpGet:
              path: /
              port: 8000

        - name: shibboleth-proxy
          image: quay.io/tike/ohtu-faded-parsons-shibboleth:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: shibboleth-credentials
              mountPath: /etc/shibboleth/credentials
              readOnly: true
            - name: shibboleth-metadata-certificate
              mountPath: /etc/shibboleth/metadata
              readOnly: true
            - name: shibboleth-cache
              mountPath: /var/cache/shibboleth
            - name: shibboleth-log
              mountPath: /var/log/shibboleth
      volumes:
        - name: saml-certificates
          secret:
            secretName: cert-and-private-key
            items:
              - key: shib.crt
                path: sp.crt
              - key: shib.key
                path: sp.key
        - name: saml-idp-certificate
          secret:
            secretName: saml-idp-certificate-staging
            optional: true
        - name: shibboleth-credentials
          secret:
            secretName: cert-and-private-key
            items:
              - key: shib.key
                path: signing-key.pem
              - key: shib.crt
                path: signing-cert.pem
              - key: shib.key
                path: encryption-key.pem
              - key: shib.crt
                path: encryption-cert.pem
        - name: shibboleth-metadata-certificate
          secret:
            secretName: shibboleth-metadata-certificate
            items:
              - key: sign-login.helsinki.fi-v2.pem
                path: sign-login.helsinki.fi-v2.pem
        - name: shibboleth-cache
          emptyDir: {}
        - name: shibboleth-log
          emptyDir: {}
